<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#ede9fe"/>
  <!-- cloud -->
  <g fill="#fff" stroke="#7c3aed" stroke-width="4">
    <path d="M70 200 a45 45 0 0 1 10 -88 a60 60 0 0 1 110 -20 a50 50 0 0 1 50 108 Z"/>
  </g>
  <!-- sunglasses -->
  <rect x="100" y="135" width="40" height="24" rx="8" fill="#111"/>
  <rect x="160" y="135" width="40" height="24" rx="8" fill="#111"/>
  <rect x="140" y="142" width="20" height="5" fill="#111"/>
  <!-- grin -->
  <path d="M125 175 q25 20 50 0" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- tiny computer hidden inside -->
  <rect x="200" y="225" width="60" height="40" rx="4" fill="#334155"/>
  <rect x="206" y="231" width="48" height="26" fill="#22d3ee"/>
  <rect x="220" y="265" width="20" height="8" fill="#334155"/>
  <text x="20" y="245" font-family="Comic Sans MS, cursive" font-size="14" fill="#5b21b6">psst... I'm just</text>
  <text x="20" y="265" font-family="Comic Sans MS, cursive" font-size="14" fill="#5b21b6">someone else's</text>
  <text x="20" y="285" font-family="Comic Sans MS, cursive" font-size="14" fill="#5b21b6">computer</text>
</svg>
