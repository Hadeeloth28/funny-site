<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <rect width="300" height="300" fill="#dcfce7"/>
  <!-- potato -->
  <path d="M70 160 C60 90 130 60 180 75 C250 95 260 170 225 215 C190 260 95 255 75 205 Z" fill="#b45309"/>
  <g fill="#78350f">
    <circle cx="110" cy="120" r="5"/><circle cx="200" cy="110" r="4"/>
    <circle cx="95" cy="200" r="4"/><circle cx="215" cy="190" r="5"/>
  </g>
  <!-- eyes -->
  <circle cx="135" cy="145" r="16" fill="#fff"/><circle cx="185" cy="145" r="16" fill="#fff"/>
  <circle cx="139" cy="149" r="7" fill="#111"/><circle cx="181" cy="141" r="7" fill="#111"/>
  <!-- sweat -->
  <path d="M225 120 q8 14 0 22 q-8 -8 0 -22" fill="#38bdf8"/>
  <!-- mouth -->
  <path d="M140 190 q20 -14 40 0" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- label -->
  <rect x="40" y="250" width="220" height="34" rx="6" fill="#166534"/>
  <text x="150" y="273" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#fff">e2-potato (0.1 vCPU)</text>
  <!-- cpu meter -->
  <rect x="20" y="20" width="110" height="26" rx="5" fill="#fff" stroke="#166534" stroke-width="2"/>
  <rect x="23" y="23" width="104" height="20" rx="3" fill="#ef4444"/>
  <text x="75" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="bold" fill="#fff">CPU 100%</text>
</svg>
